name: Qingshu dev check

# Fast compile check for work-in-progress branches: Kotlin compile of the app (no native engine
# or emulator) and, optionally, the suggestion unit tests.

on:
  push:
    branches: [autocorrect, 'dev/**']
  workflow_dispatch:

concurrency:
  group: qingshu-dev-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew compileStableDebugKotlin --continue 2>&1 | tee compile.log
      - name: Unit tests (suggestions)
        if: success()
        run: |
          set -o pipefail
          ./gradlew testStableDebugUnitTest --tests 'rocks.pkb.plektra.core.suggestions.*' --continue 2>&1 | tee test.log
      - name: Errors
        if: failure()
        run: |
          [ -f compile.log ] && grep -E '^e: ' compile.log | sed 's#file:///home/runner/work/Qingshu_ple/Qingshu_ple/##' | head -300
          [ -f test.log ] && grep -E 'FAILED|^e: |tests completed' test.log | head -200
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      print('###', tc.get('classname'), tc.get('name'))
                      print((fail.get('message') or '')[:600])
                      print('\n'.join((fail.text or '').splitlines()[1:6]))
          PY
      - name: Benchmark output
        if: always()
        run: |
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              root = ET.parse(f).getroot()
              if any(k in root.get('name','') for k in ('ChatSimulation','TypoBenchmark','RealTyping')):
                  out = root.find('system-out')
                  print('=====', root.get('name')); print((out.text or '')[-6000:] if out is not None else '')
          PY
