name: Qingshu APK

# Builds a debug APK of the pinyin branch and publishes it as the "qingshu-latest" pre-release,
# so it can be downloaded straight to the phone. If the build fails, the compiler errors are put
# in the body of the "qingshu-build-failed" pre-release instead.

on:
  push:
    # autocorrect: work in progress; built and tested, but its APK and report get "-dev" names.
    branches: [pinyin, autocorrect, 'dev/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qingshu-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release names: the pinyin branch publishes what the phone installs; other branches get -dev.
  REL_SUFFIX: ${{ github.ref != 'refs/heads/pinyin' && '-dev' || '' }}
  # crates.io downloads sometimes fail with HTTP/2 framing errors on the runners.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch Qingjian dictionary and language model
        run: scripts/fetch-qingjian-engine.sh --with-lm

      - name: Fetch the Japanese dictionary (SKK-JISYO.L)
        run: scripts/fetch-japanese-dictionary.sh

      - name: Fetch the Cantonese dictionary (rime-cantonese)
        run: scripts/fetch-cantonese-dictionary.sh

      # Built from source with Qingshu's patches (offline association), replacing the prebuilt library.
      - name: Build the Qingjian engine (arm64)
        run: |
          set -o pipefail
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-qingjian-engine.sh arm64-v8a 2>&1 | tee engine.log

      - name: Use the shared debug key (so updates install over each other)
        run: |
          mkdir -p ~/.android
          cp .github/qingshu-debug-keystore.p12 ~/.android/debug.keystore

      # The release key lives in repository secrets (QINGSHU_KEYSTORE_B64 and the passwords). With it
      # the pinyin branch builds the signed, minified release APK; without it, the debug APK.
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.QINGSHU_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -z "$REL_SUFFIX" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qingshu-release.p12"
            echo "RELEASE_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        id: build
        env:
          QS_STORE_PASSWORD: ${{ secrets.QINGSHU_KEYSTORE_PASSWORD }}
          QS_KEY_ALIAS: ${{ secrets.QINGSHU_KEY_ALIAS }}
          QS_KEY_PASSWORD: ${{ secrets.QINGSHU_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          # The version code grows with every run, so update tools (Obtainium) see each build as newer.
          version_args=(-PPLEKTRA_VERSION_NAME="26.09.${GITHUB_RUN_NUMBER}" -PPLEKTRA_VERSION_CODE="$((26090000 + GITHUB_RUN_NUMBER))")
          if [ "$RELEASE_BUILD" = true ]; then
            export PLEKTRA_KEYSTORE_PATH="$RUNNER_TEMP/qingshu-release.p12"
            export PLEKTRA_KEYSTORE_PASSWORD="$QS_STORE_PASSWORD"
            export PLEKTRA_KEY_ALIAS="$QS_KEY_ALIAS"
            export PLEKTRA_KEY_PASSWORD="${QS_KEY_PASSWORD:-$QS_STORE_PASSWORD}"
            ./gradlew assembleStableRelease --stacktrace "${version_args[@]}" 2>&1 | tee build.log
          else
            ./gradlew assembleStableDebug --stacktrace "${version_args[@]}" 2>&1 | tee build.log
          fi

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_BUILD" = true ]; then
            apk=$(ls app/build/outputs/apk/stable/release/*.apk | head -1)
            name="qingshu-26.09.${GITHUB_RUN_NUMBER}.apk"
          else
            apk=$(ls app/build/outputs/apk/stable/debug/*.apk | head -1)
            name="qingshu-debug.apk"
          fi
          cp "$apk" qingshu.apk
          [ "$name" = qingshu-debug.apk ] || cp "$apk" "$name"
          cp "$apk" qingshu-debug.apk
          gh release delete qingshu-build-failed$REL_SUFFIX --yes --cleanup-tag 2>/dev/null || true
          gh release delete qingshu-latest$REL_SUFFIX --yes --cleanup-tag 2>/dev/null || true
          # qingshu.apk: a fixed name for the download link; qingshu-debug.apk for old links.
          gh release create qingshu-latest$REL_SUFFIX qingshu.apk qingshu-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Qingshu build 26.09.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Debug APK built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ)."
          # A numbered release per pinyin build, for update tools (Obtainium tracks the latest
          # release and its tag). Only the newest few are kept.
          if [ -z "$REL_SUFFIX" ]; then
            tag="v26.09.${GITHUB_RUN_NUMBER}"
            kind=$([ "$RELEASE_BUILD" = true ] && echo "release" || echo "debug")
            gh release create "$tag" "$name" --latest --target "$GITHUB_SHA" \
              --title "Qingshu 26.09.${GITHUB_RUN_NUMBER}" \
              --notes "Qingshu $kind build from ${GITHUB_SHA::7}, version code $((26090000 + GITHUB_RUN_NUMBER))."
            gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v26\.' | sort -t. -k3 -n -r | tail -n +6 |
              while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          fi

      - name: Keep the APK for the emulator test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qingshu-debug-apk
          path: qingshu-debug.apk
          retention-days: 3

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build of ${GITHUB_SHA} failed."
            echo
            echo '```'
            [ -f engine.log ] && { echo '--- engine build ---'; grep -E '^error|^warning: unused|-->|failed' -A4 engine.log | head -c 30000; tail -n 30 engine.log; }
            [ -f build.log ] && grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -c 60000 || true
            echo
            echo '--- tail ---'
            [ -f build.log ] && tail -n 80 build.log | head -c 20000
            echo '```'
          } > notes.md
          gh release delete qingshu-build-failed$REL_SUFFIX --yes --cleanup-tag 2>/dev/null || true
          gh release create qingshu-build-failed$REL_SUFFIX --prerelease --target "$GITHUB_SHA" \
            --title "Qingshu build failed ${GITHUB_SHA::7}" --notes-file notes.md

  # Types pinyin on an emulator with injected key events (scripts/emulator-pinyin-test.sh) and
  # publishes the result as the "qingshu-emulator-test" pre-release: pass/fail lines and logs in
  # the description, screenshots and the full logcat as files.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch Qingjian dictionary and language model
        run: scripts/fetch-qingjian-engine.sh --with-lm

      - name: Fetch the Japanese dictionary (SKK-JISYO.L)
        run: scripts/fetch-japanese-dictionary.sh

      - name: Fetch the Cantonese dictionary (rime-cantonese)
        run: scripts/fetch-cantonese-dictionary.sh

      # Qingjian only publishes an arm64 engine; the emulator is x86_64, so build that ABI from
      # the same Qingjian release for this test APK (the phone APK stays arm64-only).
      - name: Build the Qingjian engine for x86_64
        run: |
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-qingjian-engine.sh x86_64

      - name: Build the test APK
        run: |
          mkdir -p ~/.android
          cp .github/qingshu-debug-keystore.p12 ~/.android/debug.keystore
          chmod +x ./gradlew
          # QA = release code with R8, plus the test host, so the test covers what users run.
          ./gradlew assembleStableQa
          cp "$(ls app/build/outputs/apk/stable/qa/*.apk | head -1)" qingshu-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run pinyin test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p test-out
            timeout 1200 bash scripts/emulator-pinyin-test.sh qingshu-debug.apk test-out/report.md || echo "emulator test script exited with $?"
            timeout 600 bash scripts/emulator-screenshots.sh test-out/screenshots || echo "screenshots exited with $?"

      - name: Publish test report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-out
          [ -f test-out/report.md ] || echo "Emulator test produced no report (see the workflow log)." > test-out/report.md
          head -c 120000 test-out/report.md > notes.md
          gh release delete qingshu-emulator-test$REL_SUFFIX --yes --cleanup-tag 2>/dev/null || true
          for f in test-out/screenshots/*.png; do [ -f "$f" ] && cp "$f" "test-out/readme-$(basename "$f")"; done
          files=$(ls test-out/*.png test-out/logcat.txt 2>/dev/null || true)
          gh release create qingshu-emulator-test$REL_SUFFIX $files --prerelease --target "$GITHUB_SHA" \
            --title "Qingshu emulator test ${GITHUB_SHA::7}" --notes-file notes.md
