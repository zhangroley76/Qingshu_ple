name: Qingshu APK

# Builds a debug APK of the pinyin branch and publishes it as the "qingshu-latest" pre-release,
# so it can be downloaded straight to the phone. If the build fails, the compiler errors are put
# in the body of the "qingshu-build-failed" pre-release instead.

on:
  push:
    branches: [pinyin]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qingshu-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch Qingjian engine and dictionary
        run: scripts/fetch-qingjian-engine.sh

      - name: Use the shared debug key (so updates install over each other)
        run: |
          mkdir -p ~/.android
          cp .github/qingshu-debug-keystore.p12 ~/.android/debug.keystore

      - name: Build
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          # The version name carries the commit, so Settings > About shows which build is installed.
          ./gradlew assembleStableDebug --stacktrace -PPLEKTRA_VERSION_NAME="26.09-qs.${GITHUB_SHA::7}" 2>&1 | tee build.log

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/stable/debug/*.apk | head -1)
          cp "$apk" qingshu-debug.apk
          gh release delete qingshu-build-failed --yes --cleanup-tag 2>/dev/null || true
          gh release delete qingshu-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create qingshu-latest qingshu-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Qingshu debug build ${GITHUB_SHA::7}" \
            --notes "Debug APK built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ)."

      - name: Keep the APK for the emulator test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qingshu-debug-apk
          path: qingshu-debug.apk
          retention-days: 3

      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build of ${GITHUB_SHA} failed."
            echo
            echo '```'
            grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -c 60000 || true
            echo
            echo '--- tail ---'
            tail -n 80 build.log | head -c 20000
            echo '```'
          } > notes.md
          gh release delete qingshu-build-failed --yes --cleanup-tag 2>/dev/null || true
          gh release create qingshu-build-failed --prerelease --target "$GITHUB_SHA" \
            --title "Qingshu build failed ${GITHUB_SHA::7}" --notes-file notes.md

  # Types pinyin on an emulator with injected key events (scripts/emulator-pinyin-test.sh) and
  # publishes the result as the "qingshu-emulator-test" pre-release: pass/fail lines and logs in
  # the description, screenshots and the full logcat as files.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch Qingjian engine and dictionary
        run: scripts/fetch-qingjian-engine.sh

      # Qingjian only publishes an arm64 engine; the emulator is x86_64, so build that ABI from
      # the same Qingjian release for this test APK (the phone APK stays arm64-only).
      - name: Build the Qingjian engine for x86_64
        run: |
          git clone --depth 1 --branch v0.3.2 https://github.com/qingjian-team/qingjian.git "$RUNNER_TEMP/qingjian"
          cd "$RUNNER_TEMP/qingjian"
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t x86_64 --platform 26 \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" build -p qingjian-android --release --locked
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs"/*

      - name: Build the test APK
        run: |
          mkdir -p ~/.android
          cp .github/qingshu-debug-keystore.p12 ~/.android/debug.keystore
          chmod +x ./gradlew
          ./gradlew assembleStableDebug
          cp "$(ls app/build/outputs/apk/stable/debug/*.apk | head -1)" qingshu-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run pinyin test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: mkdir -p test-out && bash scripts/emulator-pinyin-test.sh qingshu-debug.apk test-out/report.md

      - name: Publish test report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-out
          [ -f test-out/report.md ] || echo "Emulator test produced no report (see the workflow log)." > test-out/report.md
          head -c 120000 test-out/report.md > notes.md
          gh release delete qingshu-emulator-test --yes --cleanup-tag 2>/dev/null || true
          files=$(ls test-out/*.png test-out/logcat.txt 2>/dev/null || true)
          gh release create qingshu-emulator-test $files --prerelease --target "$GITHUB_SHA" \
            --title "Qingshu emulator test ${GITHUB_SHA::7}" --notes-file notes.md
